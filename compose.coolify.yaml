x-db-client: &db-client
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: streetaware
  PGCONNECT_TIMEOUT: "5"

x-db-owner: &db-owner
  <<: *db-client
  PGUSER: streetaware
  PGPASSWORD: ${SERVICE_PASSWORD_64_DB:?Set the database owner password}

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: streetaware
      POSTGRES_USER: streetaware
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_DB:?Set the database owner password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "streetaware", "-d", "streetaware"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: tools
    environment: *db-owner
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      target: seed
    environment:
      <<: *db-owner
      APP_DATABASE_PASSWORD: ${SERVICE_PASSWORD_64_APPDB:?Set the application database password}
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      <<: *db-client
      PGUSER: streetaware_reader
      PGPASSWORD: ${SERVICE_PASSWORD_64_APPDB:?Set the application database password}
      SERVICE_URL_APP_3000: /
      MAPTILER_PUBLIC_KEY: ${MAPTILER_PUBLIC_KEY:-}
      OSM_STREET_STYLE_URL: ${OSM_STREET_STYLE_URL:-}
      TRIP_ROUTING_URL: ${TRIP_ROUTING_URL:-}
    expose:
      - "3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/snapshot').then(async r => { if (!r.ok || !(await r.json()).snapshot) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres:
