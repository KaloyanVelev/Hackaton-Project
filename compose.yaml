name: street-aware

x-app-db: &app-db
  DATABASE_URL: postgresql://streetaware:streetaware-local@db:5432/streetaware

x-tools: &tools
  image: street-aware-tools:local
  build:
    context: .
    target: tools
  environment:
    <<: *app-db

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: streetaware
      POSTGRES_USER: streetaware
      POSTGRES_PASSWORD: streetaware-local
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetaware -d streetaware"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *tools
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    environment:
      <<: *app-db
      MAPTILER_PUBLIC_KEY: ${MAPTILER_PUBLIC_KEY:-}
      OSM_STREET_STYLE_URL: ${OSM_STREET_STYLE_URL:-}
    ports:
      - "127.0.0.1:${APP_PORT:-31001}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  importer:
    <<: *tools
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "db:import", "--", "/input/crashes.json"]
    volumes:
      - type: bind
        source: ${CRASH_JSON:-./data/crashes.json}
        target: /input/crashes.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres:
