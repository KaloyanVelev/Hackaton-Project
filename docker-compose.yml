services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: streetaware
      POSTGRES_PASSWORD: streetaware_dev
      POSTGRES_DB: streetaware
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetaware -d streetaware"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-api:
    build: ./ml-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://streetaware:streetaware_dev@db:5432/streetaware
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: qwen3.5:9b
      LLM_API_KEY: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
      - ./ml-api/artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      ML_API_URL: http://ml-api:8000
    depends_on:
      - ml-api

volumes:
  pgdata:
